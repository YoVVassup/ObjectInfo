; ObjectInfo Display Configuration
; ================================
;
; Available display fields:
;
;   Basic:
;     uiname          - UI name (with MISSING fallback)
;     id              - Internal type ID
;     uid             - Unique instance ID
;     hp              - Health points (current / max)
;     owner           - Owner house (ID and name)
;     location        - Map coordinates (X, Y)
;     group           - Group number
;     tag             - Attached tag and instance count
;
;   Combat:
;     ammo            - Ammo (current / max)
;     currentmission  - Current mission (number and name)
;     veterancy       - Veterancy level and float value
;     recruit         - RecruitA / RecruitB flags
;
;   Movement/Targeting:
;     link            - Radio links (index, UID, ID, location)
;     target          - Current target (ID, distance, location)
;     destination     - Movement destination (ID, distance, location)
;     focus           - Archive target (ID, distance, location)
;     megamission     - Mega mission (number and name)
;     megatarget      - Mega target (ID, distance, location)
;     megadestination - Mega destination (ID or cell coordinates)
;
;   Infantry/Unit specific:
;     passenger       - Passengers (count and IDs)
;
;   Building specific:
;     power           - Power bonus, output, drain
;     factory         - Production type and progress %
;     money           - Available money
;     occupants       - Garrison occupants (count and IDs)
;     enemy           - Enemy house and anger level
;     upgrades        - Upgrade slots (level / max, slot contents)
;
;   Team/AI:
;     aitrigger       - Associated AI triggers and weights
;     team            - Team ID, script ID, taskforce ID
;     currentscript   - Current script line with missing unit info

[ObjectInfoDisplayLists]
; Preset 0: Full debug info
0=uiname,id,uid,hp,owner,location,power,factory,money,occupants,enemy,upgrades,passenger,aitrigger,team,currentscript,target,destination,focus,ammo,currentmission,group,recruit,veterancy,tag,megamission,megatarget,megadestination
; Preset 1: Minimal gameplay info
1=id,hp,location,target,destination,focus
; Preset 2: Name only
2=uiname

[ObjectInfoDisplayOffset]
X=0
Y=15

[TriggerDebugPosition]
X=10
Y=180

[AITriggerDebugPosition]
X=-780
Y=180
